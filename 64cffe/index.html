*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:#f4f7f8;color:#3e3e3e;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:15px;line-height:1.6;display:flex;align-items:center;justify-content:center;padding:32px 20px;-webkit-font-smoothing:antialiased}
.box{width:100%;max-width:410px;background:#fff;border:1px solid #e2e9ec;border-radius:8px;overflow:hidden}

input:focus{outline:none;border-color:#169c9f;box-shadow:0 0 0 3px rgba(22,156,159,.13)}
button{width:100%;font:inherit;font-size:15px;font-weight:500;margin-top:16px;padding:12px;border:0;border-radius:5px;background:#0071b8;color:#fff;cursor:pointer}
button:hover{background:#065b95}button:disabled{background:#c6d2d8;cursor:not-allowed}

.f{margin-top:24px;padding-top:18px;border-top:1px solid #e2e9ec;font-size:12px;color:#98a2ab;line-height:1.6}
